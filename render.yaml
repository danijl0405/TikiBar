# Tiki Bar — app completa en Render (PHP + PostgreSQL)

databases:
  - name: tikibar-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: tikibar
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Tiki Bar
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: tikibar-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: tikibar-db
          property: connectionString
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: TIKI_HERO_VIDEO
        value: https://videos.pexels.com/video-files/855633/855633-hd_1920_1080_25fps.mp4
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
