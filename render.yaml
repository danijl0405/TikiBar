# Tiki Bar — app completa en Render (PHP + PostgreSQL)
# Importa este Blueprint en https://dashboard.render.com/blueprints

databases:
  - name: tikibar-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: tikibar
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: tikibar-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
